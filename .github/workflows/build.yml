name: build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: i686-pc-windows-msvc
          components: rust-std rust-src
      - run: |
          pnpm ts-rs
          pnpm install
          pnpm type-check
          pnpm lint
          pnpm build:con

  i686-win7-windows-msvc_fixed-webview2:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: i686-pc-windows-msvc
          components: rust-std rust-src
      - run: |
          choco install jq -y

          $sha="${{ github.sha }}"
          $job="${{ github.job }}"
          $p=gc package.json|ConvertFrom-Json
          $NEW_VERSION="$($p.version)-$job-$sha-$(($(Get-Date).ToUniversalTime().AddHours(8)).ToString('yyyy-MM-ddTHH:mm:ss+08:00'))"

          jq --arg new_version "$NEW_VERSION" '.version = $new_version' .\package.json > .\package.json.temp
          mv .\package.json.temp .\package.json -Force

          cat .\package.json
          cat .\src-tauri\tauri.conf.json
          cargo --version

          pnpm install
          pnpm tauri build

          cd ./target/i686-win7-windows-msvc/release/bundle/nsis
          Get-ChildItem -Path . -Filter '*x64*.exe' -File | ForEach-Object {
            $new = $_.Name -replace 'x64','x86'
            if (-not (Test-Path $new)) { Rename-Item -LiteralPath $_.FullName -NewName $new }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: chrm-rev_fixed-webview2
          path: ./target/i686-win7-windows-msvc/release/bundle/nsis/*

  i686-win7-windows-msvc_skip-webview2:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: i686-pc-windows-msvc
          components: rust-std rust-src
      - run: |
          choco install jq -y

          $sha="${{ github.sha }}"
          $job="${{ github.job }}"
          $p=gc package.json|ConvertFrom-Json
          $NEW_VERSION="$($p.version)-$job-$sha-$(($(Get-Date).ToUniversalTime().AddHours(8)).ToString('yyyy-MM-ddTHH:mm:ss+08:00'))"

          jq --arg new_version "$NEW_VERSION" '.version = $new_version' .\package.json > .\package.json.temp
          mv .\package.json.temp .\package.json -Force

          jq '.bundle.windows.webviewInstallMode = {"type": "skip"}' .\src-tauri\tauri.conf.json > .\src-tauri\tauri.conf.json.temp
          mv .\src-tauri\tauri.conf.json.temp .\src-tauri\tauri.conf.json -Force

          cat .\package.json
          cat .\src-tauri\tauri.conf.json
          cargo --version

          pnpm install
          pnpm tauri build

          cd ./target/i686-win7-windows-msvc/release/bundle/nsis
          Get-ChildItem -Path . -Filter '*x64*.exe' -File | ForEach-Object {
            $new = $_.Name -replace 'x64','x86'
            if (-not (Test-Path $new)) { Rename-Item -LiteralPath $_.FullName -NewName $new }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: chrm-rev_skip-webview2
          path: ./target/i686-win7-windows-msvc/release/bundle/nsis/*

  stable_x86_64-pc-windows-msvc_skip-webview2:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          choco install jq -y

          $sha="${{ github.sha }}"
          $job="${{ github.job }}"
          $p=gc package.json|ConvertFrom-Json
          $NEW_VERSION="$($p.version)-$job-$sha-$(($(Get-Date).ToUniversalTime().AddHours(8)).ToString('yyyy-MM-ddTHH:mm:ss+08:00'))"

          jq --arg new_version "$NEW_VERSION" '.version = $new_version' .\package.json > .\package.json.temp
          mv .\package.json.temp .\package.json -Force

          jq '.bundle.windows.webviewInstallMode = {"type": "skip"}' .\src-tauri\tauri.conf.json > .\src-tauri\tauri.conf.json.temp
          mv .\src-tauri\tauri.conf.json.temp .\src-tauri\tauri.conf.json -Force

          cat .\package.json
          cat .\src-tauri\tauri.conf.json

          rm ./.cargo/config.toml
          rm ./rust-toolchain.toml
          rustup default stable
          cargo --version

          pnpm install
          pnpm tauri build -t x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v7
        with:
          name: chrm-rev_skip-webview2_x64
          path: ./target/x86_64-pc-windows-msvc/release/bundle/nsis/*

  rename:
    runs-on: ubuntu-latest
    needs: [i686-win7-windows-msvc_fixed-webview2, i686-win7-windows-msvc_skip-webview2, stable_x86_64-pc-windows-msvc_skip-webview2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
      - run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)

          ls -R
          mkdir -p dist
          mv "chrm-rev_fixed-webview2/chrm-rev_${VERSION}_x86-setup.exe" "dist/chrm-rev_${VERSION}_i686-win7-windows-msvc_fixed-webview2_setup.exe"
          mv "chrm-rev_skip-webview2/chrm-rev_${VERSION}_x86-setup.exe" "dist/chrm-rev_${VERSION}_i686-win7-windows-msvc_skip-webview2_setup.exe"
          mv "chrm-rev_skip-webview2_x64/chrm-rev_${VERSION}_x64-setup.exe" "dist/chrm-rev_${VERSION}_stable_x86_64-pc-windows-msvc_skip-webview2_setup.exe"

          for file in dist/*.exe; do
            sha256sum "$file" | awk '{print $1 "  " $2}' > "${file}.sha256"
          done

          ls -R dist
      - uses: actions/upload-artifact@v7
        with:
          name: chrm-rev
          path: ./dist/*
