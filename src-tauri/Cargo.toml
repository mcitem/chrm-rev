[package]
name = "chrm-rev"
default-run = "chrm-rev"
version = "1.1.1"
edition = "2024"

[lib]
name = "chrm_rev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chrm-rev"
path = "src/bin/main.rs"

[[bin]]
name = "migration"
path = "src/bin/migration.rs"

[build-dependencies]
hex = "0.4.3"
rand = "0.10.3"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
calamine = "0.37.0"
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["from"] }
dotenvy = "0.15.7"
encoding_rs = "0.8.42"
futures = "0.3.34"

log = "0.4.34"
open = "5.4.5"
rand = "0.10.3"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
rust_decimal = { version = "1.43.0", features = [
  "macros",
  "serde",
  "serde-str",
] }
rust_xlsxwriter = { version = "0.101.0", features = ["serde", "rust_decimal"] }
sea-orm = { version = "2.0.4", features = [
  "runtime-tokio",
  "sqlx-sqlite",
  "sqlite-use-returning-for-3_35",
] }
sea-orm-migration = { version = "2.0.4", features = [
  "runtime-tokio",
  "sqlx-sqlite",
  "sqlite-use-returning-for-3_35",
] }
serde = "1.0.229"
serde_json = "1.0.154"
serde_with = "3.24.0"
tauri = { version = "2.12.5", features = ["devtools", "rustls-tls"] }
tauri-plugin-axum = { version = "0.10.0", features = [
  "catch-panic",
  "tokio-rwlock",
] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-log = "2.10.1"
tauri-plugin-pinia = "5.0.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"

tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
ts-rs = { git = "https://github.com/mcitem/ts-rs", features = [
  "sea-orm-impl",
  "serde-json-impl",
  "chrono-impl",
  "no-serde-warnings",
] }
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
tauri-utils = "=2.10.2"
